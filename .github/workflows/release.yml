name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          old=$(sed -n 's/^version: //p' pubspec.yaml)
          IFS=. read -r major minor patch <<< "$old"
          case ${{ inputs.bump }} in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
          esac
          sed -i "s/^version: $old$/version: $new/" pubspec.yaml
          sed -i "s/'$old'/'$new'/" lib/src/version.dart ios/pnta_flutter.podspec
          sed -i "s/^version = \"$old\"$/version = \"$new\"/" android/build.gradle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$new"
          git tag -a "$new" -m "$new"
          git push --follow-tags
          gh release create "$new" --generate-notes
          gh workflow run publish.yml --ref "$new"
        env:
          GH_TOKEN: ${{ github.token }}
