name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    branches: [main]
    paths: [pubspec.yaml]

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          old=$(sed -n 's/^version: //p' pubspec.yaml)
          IFS=. read -r major minor patch <<< "$old"
          case ${{ inputs.bump }} in
            major) new="$((major + 1)).0.0" ;;
            minor) new="$major.$((minor + 1)).0" ;;
            patch) new="$major.$minor.$((patch + 1))" ;;
          esac
          sed -i "s/^version: $old$/version: $new/" pubspec.yaml
          sed -i "s/'$old'/'$new'/" lib/src/version.dart ios/pnta_flutter.podspec
          sed -i "s/^version = \"$old\"$/version = \"$new\"/" android/build.gradle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/$new"
          git commit -am "Release $new"
          git push -u origin "release/$new"
          gh pr create --title "Release $new" --body "Merge to tag and publish $new."
          gh workflow run ci.yml --ref "release/$new"
        env:
          GH_TOKEN: ${{ github.token }}

  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          if git ls-remote --exit-code --tags origin "$version" >/dev/null; then
            echo "$version already tagged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
          gh release create "$version" --generate-notes
          gh workflow run publish.yml --ref "$version"
        env:
          GH_TOKEN: ${{ github.token }}
